name: MutAb
channels:
  - pytorch
  - nvidia
  - conda-forge
  - schrodinger
  - defaults
dependencies:
  - numpy=1.24.3
  - pip:
      - scipy==1.9.1
      - pandas==2.1.4
      - autogluon==1.0.0
      - autogluon-common==1.0.0
      - autogluon-core==1.0.0
      - autogluon-features==1.0.0
      - autogluon-multimodal==1.0.0
      - autogluon-tabular==1.0.0
      - autogluon-timeseries==1.0.0
      - matplotlib==3.8.3
      - tqdm==4.65.2
      - scikit-image==0.20.0
      - scikit-learn==1.4.1
prefix: /your/path/.conda/envs/MutAb
